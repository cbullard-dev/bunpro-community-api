components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        Use the Frontend API Token: the value of the `frontend_api_token` cookie that bunpro.jp sets once
        you are logged in (DevTools → Application → Cookies). It is an opaque 32-character string, not a JWT.

        The API accepts it either as `Authorization: Bearer <token>` or, as the web client sends it,
        `Authorization: Token token=<token>`. It works from a script outside the browser.

        The "API key" shown on the Bunpro settings page is a different credential and is rejected here
        with `401 AUTH_USER_DENIED`.

  parameters:
    DeckCode:
      name: deckCode
      in: path
      required: true
      description: |
        The deck's short code, as seen in its URL (`bunpro.jp/decks/{deckCode}/{slug}`) and returned as
        `deck_code`. This is not the numeric deck id.
      schema:
        type: string
      example: 'abc123'

  responses:
    TooManyRequests:
      description: Too many requests - slow down and retry after a pause (30 to 60 seconds has been enough)

    BadRequest:
      description: Bad request - invalid parameters or request body
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                description: Error message
            example:
              error: "Invalid request parameters"

    Unauthorized:
      description: Unauthorized - missing or invalid authentication token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Errors'
          example:
            errors:
              - code: 'AUTH_USER_DENIED'

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Errors'
          example:
            errors:
              - code: 'DECK_NOT_FOUND'

    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                description: Error message
            example:
              error: "Internal server error"

  schemas:
    GenericObject:
      type: object
      description: Generic response object
      additionalProperties: true

    Errors:
      type: object
      description: Error response, as observed for 400, 401 and 404. Each error has a `code` or a `detail`.
      properties:
        errors:
          type: array
          items:
            type: object
            properties:
              code:
                type: string
                description: Machine-readable error code
                example: 'AUTH_USER_DENIED'
              detail:
                type: string
                description: Human-readable message, seen on a 400
                example: 'Some params are missing in payload'

    ReviewableTuple:
      type: array
      description: |
        A reviewable as a two-element array of its type and its Bunpro id. The type is `Vocab` or
        `GrammarPoint`; `Grammar` is rejected.
      minItems: 2
      maxItems: 2
      items:
        oneOf:
          - type: string
          - type: integer
      example: ['Vocab', 652]

    ReviewableBase:
      type: object
      description: The short form of a reviewable, used in deck contents and lookup results
      properties:
        id:
          type: string
          example: '651'
        type:
          type: string
          description: |
            `reviewable_base_attribute_vocab` or `reviewable_base_attribute_grammar` in deck contents,
            `reviewable_base_attribute_mixed` in lookup results
          example: 'reviewable_base_attribute_mixed'
        attributes:
          type: object
          properties:
            id:
              type: integer
              description: Bunpro vocab (or grammar) id
              example: 651
            slug:
              type: string
              example: '時-hour'
            furigana:
              type: string
              example: '時（じ）'
            title:
              type: string
              example: '時'
            meaning:
              type: string
              example: "hour, o'clock"
            level:
              type: string
              description: |
                JLPT level, written like `N5` on vocab and like `JLPT3` on grammar points. Vocab outside
                the JLPT lists has other values, such as `A1` or `A19`.
              example: 'N5'
            type_pascal:
              type: string
              description: '`Vocab` or `GrammarPoint`'
              example: 'Vocab'
            type_snake:
              type: string
              description: '`vocab` or `grammar_point`'
              example: 'vocab'

    DeckContentFilters:
      type: object
      description: |
        Filters for a deck's contents. Each key takes a list of values, compared without regard to
        case. Several values in one key match items with any of them; several keys must all match.
        The web client always sends all five keys, but keys can be left out. A value the API does
        not know is ignored, which leaves that key unfiltered.
      properties:
        recent:
          type: array
          description: Recently reviewed or recently learned items
          items:
            type: string
            enum: [reviews, learned]
        progress:
          type: array
          description: The user's SRS progress on the item
          items:
            type: string
            enum: [new, beginner, adept, seasoned, expert, master]
        system:
          type: array
          items:
            type: string
            enum: [bookmarked, ghost, troubled]
        jlpt:
          type: array
          description: JLPT level; `none` matches items without one
          items:
            type: string
            enum: [n5, n4, n3, n2, n1, none]
        type:
          type: array
          description: Kind of reviewable. Note that grammar is `grammar` here, not `GrammarPoint`.
          items:
            type: string
            enum: [vocab, grammar]
      example:
        recent: []
        progress: []
        system: []
        jlpt: ['n5']
        type: []

    DeckList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Deck'
        included:
          type: array
          description: The user's settings for each deck in `data`
          items:
            $ref: '#/components/schemas/DeckSettings'

    Deck:
      type: object
      properties:
        id:
          type: string
          example: '12345'
        type:
          type: string
        attributes:
          $ref: '#/components/schemas/DeckAttributes'
        relationships:
          type: object

    DeckAttributes:
      type: object
      properties:
        id:
          type: integer
          description: Numeric deck id
          example: 12345
        user_id:
          type: integer
          nullable: true
          description: The owner's user id; null on Bunpro's own decks
        slug:
          type: string
          example: 'my-deck'
        deck_code:
          type: string
          description: Short code used in deck URLs and in `/decks/{deckCode}` paths
          example: 'abc123'
        vocab_count:
          type: integer
          example: 420
        grammar_count:
          type: integer
          example: 0
        is_bunpro_deck:
          type: boolean
          example: false
        is_public:
          type: boolean
          example: false
        used_by_user_count:
          type: integer
          example: 1
        cover_image_url:
          type: string
          nullable: true
        clone_status:
          type: string
          nullable: true
        deck_type:
          type: string
          description: |
            The deck's category, or an empty string. The web client uses `grammar`, `vocab`, `textbook`, `anime`, `manga`, `game`, `movie`, `novel`, `music` and `misc`.
          example: 'novel'
        is_shared:
          type: boolean
          example: false
        approval_status:
          type: string
        title:
          type: string
          example: 'My Deck'
        description:
          type: string
        reviews_due_count:
          type: integer
          description: Only returned when reading decks, not by create or update
          example: 0
        author_username:
          type: string
          nullable: true
          description: Only returned when reading decks, not by create or update
          example: 'NotARealUser'

    DeckSettings:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
        attributes:
          $ref: '#/components/schemas/DeckSettingsAttributes'
        relationships:
          type: object

    DeckSettingsAttributes:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        deck_id:
          type: integer
        batch_size:
          type: integer
        default_srs_level:
          type: integer
        sorting_order:
          type: string
          description: Vocab lesson order; see `sorting_order` on List Deck Contents for the values
          example: 'default'
        default_input_type_grammar:
          type: string
        default_input_type_vocab:
          type: string
        complete_grammar_count:
          type: integer
        complete_vocab_count:
          type: integer
        last_learned_at:
          type: string
          nullable: true
        daily_goal:
          type: integer
        daily_goal_count_grammar:
          type: integer
        daily_goal_count_vocab:
          type: integer
        is_bookmarked:
          type: boolean
        actively_studying:
          type: boolean

    DeckUnit:
      type: object
      properties:
        id:
          type: string
          example: '67890'
        type:
          type: string
        attributes:
          type: object
          properties:
            id:
              type: integer
              description: Deck unit id
              example: 67890
            deck_id:
              type: integer
              example: 12345
            deck_order:
              type: integer
              description: Zero-based position of the unit in the deck
              example: 0
            unit_title:
              type: string
              example: 'Chapter 1'
            unit_label:
              type: string
              example: ''
            deck_contents_count:
              type: integer
              description: Only returned by Get Deck
              example: 42
            learned_count:
              type: integer
              description: Only returned by Get Deck
              example: 0

    DeckContent:
      type: object
      description: One placement of a reviewable in a deck
      properties:
        id:
          type: string
          example: '1234567'
        type:
          type: string
        attributes:
          type: object
          properties:
            id:
              type: integer
              description: Deck content id
              example: 1234567
            deck_id:
              type: integer
              example: 12345
            deck_unit_id:
              type: integer
              example: 67890
            contentable_type:
              type: string
              description: '`Vocab` or `GrammarPoint`'
              example: 'Vocab'
            contentable_id:
              type: integer
              description: The reviewable's own id (a Bunpro vocab id when `contentable_type` is `Vocab`)
              example: 652
            order:
              type: integer
              description: |
                Position within the unit, lowest first. The numbers are not predictable: the first items
                added to a new unit have been seen starting at 0 and at 1000.
              example: 0
        relationships:
          type: object
          properties:
            contentable:
              type: object
              properties:
                data:
                  type: object
                  description: Points at the matching entry in `included`
                  properties:
                    id:
                      type: string
                    type:
                      type: string

    Pagy:
      type: object
      description: Pagination details. Only the most useful fields are listed.
      additionalProperties: true
      properties:
        count:
          type: integer
          description: Total number of items
          example: 420
        page:
          type: integer
          example: 1
        items:
          type: integer
          description: Items per page
          example: 50
        pages:
          type: integer
          description: Total number of pages
          example: 9
        prev:
          type: integer
          nullable: true
        next:
          type: integer
          nullable: true
          example: 2

    Vocab:
      type: object
      properties:
        id:
          type: string
          example: '652'
        type:
          type: string
          example: 'vocab'
        attributes:
          $ref: '#/components/schemas/VocabAttributes'
        relationships:
          type: object

    VocabAttributes:
      type: object
      properties:
        id:
          type: integer
          description: Bunpro vocab id
          example: 652
        title:
          type: string
          example: '時'
        jlpt_level:
          type: string
          example: 'N5'
        furigana:
          type: string
          example: '時（とき）'
        kana:
          type: string
          description: Primary reading
          example: 'とき'
        slug:
          type: string
          example: '時'
        pitch_accent_stress:
          type: string
          example: 'LH'
        frequency_anime:
          type: integer
          example: 121
        frequency_novels:
          type: integer
          example: 104
        frequency_general:
          type: integer
          example: 48
        frequency_netflix:
          type: integer
          example: 83
        frequency_dictionary:
          type: integer
          example: 112
        female_audio_url:
          type: string
          example: ''
        male_audio_url:
          type: string
          example: ''
        has_tts_audio:
          type: boolean
          example: true
        jmdict_id:
          type: integer
          description: The id of the matching JMdict entry
          example: 1315840
        jmdict_data:
          type: object
          description: The JMdict entry, in the shape used by jmdict-simplified
          properties:
            id:
              type: string
              example: '1315840'
            kanji:
              type: array
              description: Every kanji spelling of the entry
              items:
                type: object
                properties:
                  common:
                    type: boolean
                  text:
                    type: string
                    example: '時'
                  tags:
                    type: array
                    items:
                      type: string
            kana:
              type: array
              description: Every reading of the entry
              items:
                type: object
                properties:
                  common:
                    type: boolean
                  text:
                    type: string
                    example: 'とき'
                  tags:
                    type: array
                    items:
                      type: string
                  appliesToKanji:
                    type: array
                    items:
                      type: string
            sense:
              type: array
              description: The entry's senses, each with `partOfSpeech`, `gloss` and related fields
              items:
                $ref: '#/components/schemas/GenericObject'
        jmdict_pos:
          type: array
          items:
            type: string
          example: ['n']
        wrong_answers:
          type: string
          example: ''
        nuance:
          type: string
          description: Explanation of the word, in Japanese
        nuance_translation:
          type: string
          description: Explanation of the word, in English
        type_snake:
          type: string
          example: 'vocab'
        type_pascal:
          type: string
          example: 'Vocab'
        meaning:
          type: string
          example: 'time, hour, moment'
        accepted_answers:
          type: string
          description: Comma-separated English answers accepted in reviews

    User:
      type: object
      properties:
