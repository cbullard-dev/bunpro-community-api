openapi: 3.1.0
info:
  title: Bunpro Community API
  version: 1.1.0
  description: |
    A community-maintained reverse-engineered API reference for Bunpro, a spaced repetition system for learning Japanese grammar.

    ## Errors

    Errors observed so far are returned as a list of codes, for example
    `{"errors":[{"code":"AUTH_USER_DENIED"}]}` (401) or `{"errors":[{"code":"DECK_NOT_FOUND"}]}` (404).
    The web client treats `AUTH_USER_DENIED` as "log in again" and `AUTH_USER_NO_SUB` as "needs a subscription".

    ## Rate limiting

    Bursts of requests are answered with HTTP 429. It was hit after roughly 350 `GET /reviewables/vocab/{id}`
    calls made three at a time, and cleared after 30 to 60 seconds. About one request per second, sent
    sequentially, has been reliable.

    ## Vocab identifiers

    Two different id systems appear in the deck and vocab endpoints, and they are easy to mix up:

    - **Bunpro vocab id**: Bunpro's internal id, e.g. `652` for 時 (とき). Used in reviewable tuples such as
      `["Vocab", 652]`, in `GET /reviewables/vocab/{id}`, and as `contentable_id` in deck contents.
    - **JMdict id**: the dictionary's entry id, e.g. `1315840` for 時 (とき). Returned as `jmdict_id` on a vocab,
      and accepted by `POST /decks/import/search` when `is_jmdict_mode` is `true`.
  contact:
    name: Bunpro Community API
    url: https://github.com/cbullard-dev/bunpro-community-api
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: https://api.bunpro.jp/api/frontend
    description: Bunpro Frontend API Server

security:
  - bearerAuth: []

paths:
  /user:
    get:
      tags:
        - User
      summary: Get User
      description: Retrieve the current user's information
      operationId: getUser
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              example:
                {
                  "user": {
                    "data": {
                      "id": "12345",
                      "type": "user",
                      "attributes": {
                        "id": 12345,
                        "username": "NotARealUser",
                        "level": 34,
                        "xp": 64043,
                        "is_lifetime": false
                      }
                    }
                  },
                  "active_cosmetics": {
                    "data": []
                  },
                  "active_title": null
                }

        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /user/user_furigana:
    get:
      tags:
        - User
      summary: Get User Furigana
      description: Retrieve the user's furigana settings
      operationId: getUserFurigana
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericObject'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /user/add_known_kanji:
    post:
      tags:
        - User
      summary: Add Known Kanji
      description: Add kanji to the user's known kanji list
      operationId: addKnownKanji
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - kanji
              properties:
                kanji:
                  type: string
                  description: The kanji character(s) to add
                  example: "漢"
            example:
              kanji: "漢"
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericObject'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /user/remove_known_kanji:
    delete:
      tags:
        - User
      summary: Remove Known Kanji
      description: Remove kanji from the user's known kanji list
      operationId: removeKnownKanji
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - kanji
              properties:
                kanji:
                  type: string
                  description: The kanji character(s) to remove
                  example: "漢"
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericObject'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /user/due:
    get:
      tags:
        - User
      summary: Get Due
      description: Retrieve items due for review
      operationId: getDue
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericObject'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /user/queue:
    get:
      tags:
        - User
      summary: Get Queue
      description: Retrieve the user's review queue
      operationId: getQueue
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericObject'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /bookmarks:
    post:
      tags:
        - Bookmarks
      summary: Add Bookmark
      description: Add a new bookmark
      operationId: addBookmark
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenericObject'
      responses:
        '201':
          description: Bookmark created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericObject'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /bookmarks/{bookmarkId}:
    delete:
      tags:
        - Bookmarks
      summary: Delete Bookmark
      description: Delete a bookmark by ID
      operationId: deleteBookmark
      parameters:
        - name: bookmarkId
          in: path
          required: true
          description: The ID of the bookmark to delete
          schema:
            type: string
          example: "12345"
      responses:
        '200':
          description: Bookmark deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericObject'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /completed_readings:
    patch:
      tags:
        - Completed Readings
      summary: Completed Readings
      description: Update completed readings
      operationId: completedReadings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenericObject'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericObject'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /decks/my_decks:
    get:
      tags:
        - Decks
      summary: Get My Decks
      description: |
        Retrieve the current user's decks in three groups: decks they created, decks in their learn queue,
        and decks they bookmarked. Each group also carries the user's settings for those decks in `included`.

        Status: verified against the live API (October 2026).
      operationId: getMyDecks
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  custom_decks:
                    $ref: '#/components/schemas/DeckList'
                  learn_queue_decks:
                    $ref: '#/components/schemas/DeckList'
                  bookmarked_decks:
                    $ref: '#/components/schemas/DeckList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /decks/create:
    post:
      tags:
        - Decks
      summary: Create Deck
      description: |
        Create a custom deck. New decks are private.

        Status: verified against the live API (October 2026) with `title`, `description` and `slug`.
        `deck_type` and `cover_image` are taken from the web client and have not been tested.
      operationId: createDeck
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - deck
              properties:
                deck:
                  type: object
                  required:
                    - title
                    - slug
                  properties:
                    title:
                      type: string
                      example: 'My Deck'
                    description:
                      type: string
                      example: 'Words from a book I am reading'
                    slug:
                      type: string
                      example: 'my-deck'
                    deck_type:
                      type: string
                      description: Untested.
                    cover_image:
                      type: string
                      description: Cover image as a data URL. Untested.
            example:
              deck:
                title: 'My Deck'
                description: 'Words from a book I am reading'
                slug: 'my-deck'
      responses:
        '201':
          description: Deck created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Deck'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /decks/import/search:
    post:
      tags:
        - Decks
      summary: Bulk Vocab Lookup
      description: |
        Resolve a batch of words, or JMdict ids, to Bunpro reviewables. This is the lookup behind the
        deck import page. The web client sends at most 30 queries per request.

        Each result echoes the `key` of its query. `base_attributes` is `null` when nothing matched.

        When `multiple_matches` is `true` the entry returned is only the first of several homographs, and
        it is often not the one you meant: 時 returns 時 (じ, "o'clock") rather than 時 (とき, "time"), and
        か returns 蚊 ("mosquito"). Check the reading and meaning with `GET /reviewables/vocab/{id}`, or
        look the word up by JMdict id, before using the result.

        `POST /search/v1_1` currently fails with a 500, so this is the working way to search by text.

        Status: verified against the live API (October 2026), with `reviewable_type` `Vocab` only.
      operationId: importSearch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - queries
              properties:
                key:
                  type: string
                  description: Client-chosen label for the batch
                  example: 'b0'
                is_jmdict_mode:
                  type: boolean
                  description: When true, each `query` is a JMdict id instead of Japanese text
                  default: false
                queries:
                  type: array
                  maxItems: 30
                  items:
                    type: object
                    required:
                      - key
                      - reviewable_type
                      - query
                    properties:
                      key:
                        type: string
                        description: Client-chosen label, echoed back on the matching result
                        example: 'q0'
                      reviewable_type:
                        type: string
                        example: 'Vocab'
                      query:
                        type: string
                        description: Japanese text, or a JMdict id when `is_jmdict_mode` is true
                        example: '時'
            example:
              key: 'b0'
              is_jmdict_mode: false
              queries:
                - key: 'q0'
                  reviewable_type: 'Vocab'
                  query: '時'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        key:
                          type: string
                          example: 'q0'
                        base_attributes:
                          type: object
                          nullable: true
                          description: The matched reviewable, or null when nothing matched
                          properties:
                            data:
                              $ref: '#/components/schemas/ReviewableBase'
                        multiple_matches:
                          type: boolean
                          description: True when the query matched more than one entry
              example:
                results:
                  - key: 'q0'
                    base_attributes:
                      data:
                        id: '651'
                        type: 'reviewable_base_attribute_mixed'
                        attributes:
                          id: 651
                          slug: '時-hour'
                          furigana: '時（じ）'
                          title: '時'
                          meaning: "hour, o'clock"
                          level: 'N5'
                          type_pascal: 'Vocab'
                          type_snake: 'vocab'
                    multiple_matches: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /decks/add_reviewables_to_unit:
    post:
      tags:
        - Decks
      summary: Add Reviewables To Unit
      description: |
        Append reviewables to the end of a deck unit. Note that this takes the numeric deck id, not the
        deck code. The response body is `null`, so list the deck contents afterwards to confirm.

        Status: verified against the live API (October 2026) with `Vocab` items, 22 in one call.
        Adding an item that is already in the deck has not been tested.
      operationId: addReviewablesToUnit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - deck_id
                - deck_unit_id
                - new_contents
              properties:
                deck_id:
                  type: integer
                  example: 12345
                deck_unit_id:
                  type: integer
                  example: 67890
                new_contents:
                  type: array
                  items:
                    $ref: '#/components/schemas/ReviewableTuple'
            example:
              deck_id: 12345
              deck_unit_id: 67890
              new_contents:
                - ['Vocab', 652]
      responses:
        '200':
          description: Successful response. The body is `null`.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /decks/delete_reviewables_from_deck:
    delete:
      tags:
        - Decks
      summary: Remove Reviewables From Deck
      description: |
        Remove reviewables from a deck by reviewable id, whichever unit they are in. Note that this takes
        the numeric deck id, not the deck code. The response body is `null`.

        Status: verified against the live API (October 2026) with `Vocab` items, 9 in one call.
      operationId: deleteReviewablesFromDeck
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - deck_id
                - contents_to_delete
              properties:
                deck_id:
                  type: integer
                  example: 12345
                contents_to_delete:
                  type: array
                  items:
                    $ref: '#/components/schemas/ReviewableTuple'
            example:
              deck_id: 12345
              contents_to_delete:
                - ['Vocab', 651]
      responses:
        '200':
          description: Successful response. The body is `null`.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /decks/{deckCode}:
    parameters:
      - $ref: '#/components/parameters/DeckCode'
    get:
      tags:
        - Decks
      summary: Get Deck
      description: |
        Retrieve a deck, optionally with its units.

        Status: verified against the live API (October 2026) with `include=units,deletion_info`.
      operationId: getDeck
      parameters:
        - name: include
          in: query
          required: false
          description: Comma-separated extras to return alongside the deck
          schema:
            type: string
          example: 'units,deletion_info'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  deck:
                    type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Deck'
                  deletion_info:
                    type: object
                    description: Present when requested with `include`
                    properties:
                      has_other_learners:
                        type: boolean
                  units:
                    type: object
                    description: Present when requested with `include`
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/DeckUnit'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      tags:
        - Decks
      summary: Update Deck
      description: |
        Update a deck's details.

        Status: verified against the live API (October 2026) with `title`.
      operationId: updateDeck
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - deck
              properties:
                deck:
                  type: object
                  properties:
                    title:
                      type: string
                    description:
                      type: string
            example:
              deck:
                title: 'My Renamed Deck'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericObject'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags:
        - Decks
      summary: Delete Deck
      description: |
        Delete a deck.

        Status: verified against the live API (October 2026).
      operationId: deleteDeck
      responses:
        '200':
          description: Deck deleted successfully
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /decks/{deckCode}/deck_units:
    parameters:
      - $ref: '#/components/parameters/DeckCode'
    post:
      tags:
        - Decks
      summary: Create Deck Unit
      description: |
        Add a unit (a section) to a deck. Every item in a deck belongs to a unit.

        Status: verified against the live API (October 2026).
      operationId: createDeckUnit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - unit_title
              properties:
                unit_title:
                  type: string
                  example: 'Chapter 1'
                unit_label:
                  type: string
                  example: ''
            example:
              unit_title: 'Chapter 1'
              unit_label: ''
      responses:
        '201':
          description: Unit created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/DeckUnit'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags:
        - Decks
      summary: Delete Deck Units
      description: |
        Delete units from a deck.

        Status: taken from the web client; not yet tested.
      operationId: deleteDeckUnits
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - ids
              properties:
                ids:
                  type: array
                  description: Deck unit ids
                  items:
                    type: integer
            example:
              ids: [67890]
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericObject'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /decks/{deckCode}/deck_units/bulk_update:
    parameters:
      - $ref: '#/components/parameters/DeckCode'
    patch:
      tags:
        - Decks
      summary: Reorder Or Rename Deck Units
      description: |
        Change the order or titles of a deck's units.

        Status: taken from the web client; not yet tested.
      operationId: bulkUpdateDeckUnits
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - units
              properties:
                units:
                  type: array
                  items:
                    type: object
                    required:
                      - id
                    properties:
                      id:
                        type: integer
                        description: Deck unit id
                      deck_order:
                        type: integer
                        description: Zero-based position of the unit in the deck
                      unit_title:
                        type: string
            example:
              units:
                - id: 67890
                  deck_order: 0
                  unit_title: 'Chapter 1'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericObject'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /decks/{deckCode}/contents:
    parameters:
      - $ref: '#/components/parameters/DeckCode'
    post:
      tags:
        - Decks
      summary: List Deck Contents
      description: |
        List the items in a deck, one page at a time. This is a POST because the filters travel in the body.

        Each entry in `contents.data` is one placement of a reviewable in the deck: `id` is the deck content
        id used by the reorder and delete-by-content-id endpoints, and `contentable_id` is the reviewable's
        own id. Titles and meanings are in `contents.included`.

        Status: verified against the live API (October 2026). `filters` and `sorting_order` were only sent
        as `{}` and `null`.
      operationId: listDeckContents
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                page:
                  type: integer
                  minimum: 1
                  example: 1
                per_page:
                  type: integer
                  example: 50
                filters:
                  type: object
                  additionalProperties: true
                sorting_order:
                  type: string
                  nullable: true
                deck_unit_id:
                  type: string
                  description: Only list the contents of this unit
                  example: '67890'
                query:
                  type: string
                  description: Only list contents matching this text
            example:
              page: 1
              per_page: 50
              filters: {}
              sorting_order: null
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  contents:
                    type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/DeckContent'
                      included:
                        type: array
                        items:
                          $ref: '#/components/schemas/ReviewableBase'
                  pagy:
                    $ref: '#/components/schemas/Pagy'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /decks/{deckCode}/deck_contents:
    parameters:
      - $ref: '#/components/parameters/DeckCode'
    delete:
      tags:
        - Decks
      summary: Delete Deck Contents
      description: |
        Remove items from a deck by deck content id (the `id` of an entry from List Deck Contents).

        Status: verified against the live API (October 2026).
      operationId: deleteDeckContents
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - ids
              properties:
                ids:
                  type: array
                  description: Deck content ids
                  items:
                    type: integer
            example:
              ids: [1234567]
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericObject'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
