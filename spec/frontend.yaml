  /decks/{deckCode}/deck_contents/bulk_update:
    parameters:
      - $ref: '#/components/parameters/DeckCode'
    patch:
      tags:
        - Decks
      summary: Reorder Or Move Deck Contents
      description: |
        Change the order of items within a unit, or move items to another unit by changing `deck_unit_id`.
        The web client sends the full ordered list for each unit it changes, with `order` running from
        0 to n-1. Returns the updated contents.

        Status: verified against the live API (October 2026), 396 items in one call.
      operationId: bulkUpdateDeckContents
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - contents
              properties:
                contents:
                  type: array
                  items:
                    type: object
                    required:
                      - id
                    properties:
                      id:
                        type: integer
                        description: Deck content id
                      order:
                        type: integer
                        description: Zero-based position within the unit
                      deck_unit_id:
                        type: integer
                        description: The unit the item belongs in
            example:
              contents:
                - id: 1234567
                  order: 0
                  deck_unit_id: 67890
                - id: 1234568
                  order: 1
                  deck_unit_id: 67890
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericObject'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

