components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        Use the Frontend API Token: the value of the `frontend_api_token` cookie that bunpro.jp sets once
        you are logged in (DevTools → Application → Cookies). It is an opaque 32-character string, not a JWT.

        The API accepts it either as `Authorization: Bearer <token>` or, as the web client sends it,
        `Authorization: Token token=<token>`. It works from a script outside the browser.

        The "API key" shown on the Bunpro settings page is a different credential and is rejected here
        with `401 AUTH_USER_DENIED`.

  parameters:
    DeckCode:
      name: deckCode
      in: path
      required: true
      description: |
        The deck's short code, as seen in its URL (`bunpro.jp/decks/{deckCode}/{slug}`) and returned as
        `deck_code`. This is not the numeric deck id.
      schema:
        type: string
      example: 'abc123'

  responses:
    TooManyRequests:
      description: Too many requests - slow down and retry after a pause (30 to 60 seconds has been enough)

    BadRequest:
      description: Bad request - invalid parameters or request body
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                description: Error message
            example:
              error: "Invalid request parameters"

    Unauthorized:
      description: Unauthorized - missing or invalid authentication token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Errors'
          example:
            errors:
              - code: 'AUTH_USER_DENIED'

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Errors'
          example:
            errors:
              - code: 'DECK_NOT_FOUND'

    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                description: Error message
            example:
              error: "Internal server error"

  schemas:
    GenericObject:
      type: object
      description: Generic response object
      additionalProperties: true

    Errors:
      type: object
      description: Error response, as observed for 401 and 404
      properties:
        errors:
          type: array
          items:
            type: object
            properties:
              code:
                type: string
                description: Machine-readable error code
                example: 'AUTH_USER_DENIED'

    ReviewableTuple:
      type: array
      description: A reviewable as a two-element array of its type (`Vocab` or `Grammar`) and its Bunpro id
      minItems: 2
      maxItems: 2
      items:
        oneOf:
          - type: string
          - type: integer
      example: ['Vocab', 652]

    ReviewableBase:
      type: object
      description: The short form of a reviewable, used in deck contents and lookup results
      properties:
        id:
          type: string
          example: '651'
        type:
          type: string
          example: 'reviewable_base_attribute_mixed'
        attributes:
          type: object
          properties:
            id:
              type: integer
              description: Bunpro vocab (or grammar) id
              example: 651
            slug:
              type: string
              example: '時-hour'
            furigana:
              type: string
              example: '時（じ）'
            title:
              type: string
              example: '時'
            meaning:
              type: string
              example: "hour, o'clock"
            level:
              type: string
              example: 'N5'
            type_pascal:
              type: string
              example: 'Vocab'
            type_snake:
              type: string
              example: 'vocab'

    DeckList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Deck'
        included:
          type: array
          description: The user's settings for each deck in `data`
          items:
            $ref: '#/components/schemas/DeckSettings'

    Deck:
      type: object
      properties:
        id:
          type: string
          example: '12345'
        type:
          type: string
        attributes:
          $ref: '#/components/schemas/DeckAttributes'
        relationships:
          type: object

    DeckAttributes:
      type: object
      properties:
        id:
          type: integer
          description: Numeric deck id
          example: 12345
        user_id:
          type: integer
          nullable: true
          description: The owner's user id; null on Bunpro's own decks
        slug:
          type: string
          example: 'my-deck'
        deck_code:
          type: string
          description: Short code used in deck URLs and in `/decks/{deckCode}` paths
          example: 'abc123'
        vocab_count:
          type: integer
          example: 420
        grammar_count:
          type: integer
          example: 0
        is_bunpro_deck:
          type: boolean
          example: false
        is_public:
          type: boolean
          example: false
        used_by_user_count:
          type: integer
          example: 1
        cover_image_url:
          type: string
          nullable: true
        clone_status:
          type: string
          nullable: true
        deck_type:
          type: string
        is_shared:
          type: boolean
          example: false
        approval_status:
          type: string
        title:
          type: string
          example: 'My Deck'
        description:
          type: string
        reviews_due_count:
          type: integer
